<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160d24">
<title>My Spotify Playlists</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:32px 18px;background:radial-gradient(circle at top,#392052 0,#160d24 48%,#0b0910 100%);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Sinhala",sans-serif;display:flex;align-items:center;justify-content:center}
main{width:min(100%,520px);padding:30px 22px;border:1px solid #69478a;border-radius:26px;background:#17101fdd;box-shadow:0 20px 70px #0008}
.kicker{text-align:center;color:#c9a6ef;letter-spacing:3px;font-size:11px;font-weight:700}
h1{text-align:center;margin:10px 0 8px;font-size:29px}
p{text-align:center;color:#c9bfd2;margin:0 0 25px;line-height:1.7}
a{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:white;background:linear-gradient(110deg,#553276,#30203f);border:1px solid #8056a4;padding:17px 18px;border-radius:15px;margin:12px 0;font-weight:650;transition:transform .15s,background .15s}
a:active{transform:scale(.98)}
a span:last-child{color:#d7b8f5;font-size:20px}
footer{text-align:center;color:#9c8da8;font-size:12px;margin-top:24px}
</style>
</head>
<body>
<main>
<div class="kicker">✦ YOUR MUSIC COLLECTION ✦</div>
<h1>Spotify Playlists</h1>
<p>ඔයාගේ mood එකට ගැළපෙන playlist එක තෝරන්න 💜</p>

<a href="https://open.spotify.com/playlist/5kLSpQGxLV0HjIU9pWJw8Q" target="_blank" rel="noopener"><span>Playlist 03</span><span>↗</span></a>
<a href="https://open.spotify.com/playlist/2tDQqNWrNIGJ0uEuA6dxh8" target="_blank" rel="noopener"><span>Playlist 04</span><span>↗</span></a>
<footer>Tap a playlist to open it in Spotify</footer>
</main>
</body>
</html>
