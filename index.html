<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160d24">
<title>My Spotify Playlists</title>
<style>
*{box-sizing:border-box}
:root{--lav:#c9a6ef;--deep:#160d24;--petal:#d9b9f3;--gold:#f4d9a6}
body{margin:0;min-height:100vh;padding:42px 18px;background:radial-gradient(circle at 50% 0,#503064 0,#21132f 43%,#0b0910 100%);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Sinhala",sans-serif;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
main{position:relative;isolation:isolate;width:min(100%,520px);padding:38px 23px 30px;border:1px solid #805ca0;border-radius:28px;background:linear-gradient(145deg,#21152ddd,#130e1bea);box-shadow:0 20px 70px #0009;z-index:1}
main:before,main:after{content:"";position:absolute;inset:10px;border:1px solid #ffffff12;border-radius:21px;pointer-events:none;z-index:-1}
.kicker{text-align:center;color:#d8b9f4;letter-spacing:3px;font-size:11px;font-weight:750}
h1{text-align:center;margin:12px 0 8px;font-size:29px}
p{text-align:center;color:#d3c5df;margin:0 0 25px;line-height:1.7}
a.playlist{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:white;background:linear-gradient(110deg,#674087,#352347);border:1px solid #9b73b8;padding:17px 18px;border-radius:15px;margin:12px 0;font-weight:650;transition:transform .2s,filter .2s,box-shadow .2s;box-shadow:0 5px 18px #0003}
a.playlist:hover{transform:translateY(-3px);filter:brightness(1.12);box-shadow:0 9px 24px #0005}
a.playlist:active{transform:scale(.98)}
a.playlist span:last-child{color:#f1d9ff;font-size:20px}
footer{text-align:center;color:#b6a4c4;font-size:12px;margin-top:24px}
.flower{position:absolute;width:76px;height:76px;pointer-events:none;z-index:3;transform-origin:50% 78%;animation:sway 4.8s ease-in-out infinite}
.flower svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 5px 7px #0005)}
.flower.one{top:-30px;left:-18px;animation-delay:-1.2s}
.flower.two{top:-27px;right:-17px;width:68px;height:68px;animation-delay:-2.8s}
.flower.three{bottom:-29px;left:16px;width:63px;height:63px;animation-delay:-.6s}
.flower.four{bottom:-26px;right:12px;width:74px;height:74px;animation-delay:-3.4s}
@keyframes sway{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(9deg) translateY(-5px)}}
.petal{position:fixed;top:-12vh;z-index:0;pointer-events:none;opacity:.78;font-size:22px;animation:fall linear infinite}
.p1{left:8%;animation-duration:13s;animation-delay:-4s}.p2{left:26%;font-size:17px;animation-duration:17s;animation-delay:-11s}.p3{left:48%;font-size:20px;animation-duration:15s;animation-delay:-7s}.p4{left:72%;font-size:16px;animation-duration:19s;animation-delay:-13s}.p5{left:91%;font-size:23px;animation-duration:14s;animation-delay:-2s}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:0}10%{opacity:.75}50%{transform:translate3d(35px,55vh,0) rotate(180deg)}100%{transform:translate3d(-25px,115vh,0) rotate(360deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="petal p1">✿</div><div class="petal p2">❀</div><div class="petal p3">✿</div><div class="petal p4">❀</div><div class="petal p5">✿</div>
<main>
  <div class="flower one" aria-hidden="true"><svg viewBox="0 0 100 100"><g fill="#d9b9f3" stroke="#f3e5ff" stroke-width="1.5"><ellipse cx="50" cy="25" rx="13" ry="22"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(60 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(120 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(180 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(240 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(300 50 50)"/></g><circle cx="50" cy="50" r="10" fill="#f4d9a6"/></svg></div>
  <div class="flower two" aria-hidden="true"><svg viewBox="0 0 100 100"><g fill="#f0c8dc" stroke="#ffe8f2" stroke-width="1.5"><ellipse cx="50" cy="25" rx="13" ry="22"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(60 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(120 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(180 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(240 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(300 50 50)"/></g><circle cx="50" cy="50" r="10" fill="#f4d9a6"/></svg></div>
  <div class="flower three" aria-hidden="true"><svg viewBox="0 0 100 100"><g fill="#b8d9b0" stroke="#e4f2df" stroke-width="1.5"><ellipse cx="50" cy="25" rx="13" ry="22"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(60 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(120 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(180 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(240 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(300 50 50)"/></g><circle cx="50" cy="50" r="10" fill="#f4d9a6"/></svg></div>
  <div class="flower four" aria-hidden="true"><svg viewBox="0 0 100 100"><g fill="#d9b9f3" stroke="#f3e5ff" stroke-width="1.5"><ellipse cx="50" cy="25" rx="13" ry="22"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(60 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(120 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(180 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(240 50 50)"/><ellipse cx="50" cy="25" rx="13" ry="22" transform="rotate(300 50 50)"/></g><circle cx="50" cy="50" r="10" fill="#f4d9a6"/></svg></div>
  <div class="kicker">✦ YOUR MUSIC COLLECTION ✦</div>
  <h1>Spotify Playlists</h1>
  <p>ඔයාගේ mood එකට ගැළපෙන playlist එක තෝරන්න 💜</p>

  <a class="playlist" href="https://open.spotify.com/playlist/5kLSpQGxLV0HjIU9pWJw8Q" target="_blank" rel="noopener"><span>Playlist 03</span><span>↗</span></a>
  <a class="playlist" href="https://open.spotify.com/playlist/2tDQqNWrNIGJ0uEuA6dxh8" target="_blank" rel="noopener"><span>Playlist 04</span><span>↗</span></a>
  <footer>Tap a playlist to open it in Spotify ✦</footer>
</main>
</body>
</html>
